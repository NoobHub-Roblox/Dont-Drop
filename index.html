<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090c11" />
    <title>Don't Drop</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/examples/jsm/",
          "@dimforge/rapier3d-compat": "./vendor/rapier/rapier.es.js"
        }
      }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090c11'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffc857'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <div id="stage"><canvas id="game" tabindex="-1"></canvas></div>
      <div id="flash" aria-hidden="true"></div>

      <!-- In-game HUD -->
      <div id="hud" class="hidden">
        <div class="hud-top">
          <div class="hud-left">
            <div class="hud-level"><span id="hud-num">LEVEL 01</span><span id="hud-name"></span></div>
          </div>
          <div class="hud-center" aria-live="polite">
            <div id="hud-dots" class="dots"></div>
            <div class="hud-count"><span id="hud-remaining">1</span> <small>to go</small></div>
          </div>
          <div class="hud-right">
            <button class="icon-btn" id="btn-restart" title="Restart (R)" aria-label="Restart">
              <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>
            </button>
            <button class="icon-btn" id="btn-pause" title="Pause (P)" aria-label="Pause">
              <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
            </button>
          </div>
        </div>
        <div id="replay-bar" class="replay-bar hidden">
          <span class="rec">REPLAY</span>
          <button class="btn mini" id="btn-replay-speed" title="Playback speed">1×</button>
          <button class="btn mini" id="btn-replay-stop" title="Skip to end (Esc)">Skip</button>
        </div>
        <div id="hint" class="hint"></div>
        <div id="dpad" class="dpad" aria-label="On-screen tilt controls">
          <button data-dir="up" aria-label="Tilt forward"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
          <button data-dir="left" aria-label="Tilt left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button data-dir="right" aria-label="Tilt right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
          <button data-dir="down" aria-label="Tilt back"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
      </div>

      <!-- Main menu -->
      <section id="screen-menu" class="screen">
        <div class="panel menu-panel">
          <h1 class="title">DON'T<br />DROP</h1>
          <p class="tagline">Tilt. Roll. Don't fall.</p>
          <div class="stack">
            <button class="btn primary" id="menu-play">Play</button>
            <button class="btn" id="menu-levels">Level Select</button>
            <button class="btn" id="menu-settings">Settings</button>
            <button class="btn ghost" id="menu-sound" aria-pressed="true">Sound: On</button>
          </div>
          <p class="foot">WASD / Arrows or drag to tilt &nbsp;·&nbsp; R restart &nbsp;·&nbsp; P pause</p>
        </div>
      </section>

      <!-- Level select -->
      <section id="screen-levels" class="screen hidden">
        <div class="panel wide">
          <h2>Select Level</h2>
          <div id="level-grid" class="level-grid"></div>
          <div class="row end"><button class="btn" id="levels-back">Back</button></div>
        </div>
      </section>

      <!-- Settings -->
      <section id="screen-settings" class="screen hidden">
        <div class="panel">
          <h2>Settings</h2>
          <label class="setting">
            <span>Difficulty</span>
            <select id="set-diff">
              <option value="easy">Relaxed (grippy balls)</option>
              <option value="normal">Normal (slippery)</option>
              <option value="hard">Hard (ice)</option>
            </select>
          </label>
          <label class="setting">
            <span>Tilt sensitivity <output id="out-sens">1.0</output></span>
            <input type="range" id="set-sens" min="0.5" max="1.6" step="0.05" />
          </label>
          <label class="setting">
            <span>Volume <output id="out-vol">70</output></span>
            <input type="range" id="set-vol" min="0" max="1" step="0.05" />
          </label>
          <label class="setting toggle"><span>Sound effects</span><input type="checkbox" id="set-sound" /></label>
          <label class="setting toggle"><span>On-screen controls</span><input type="checkbox" id="set-pad" /></label>
          <label class="setting toggle"><span>Soft shadows</span><input type="checkbox" id="set-shadows" /></label>
          <div class="row end"><button class="btn" id="settings-back">Back</button></div>
        </div>
      </section>

      <!-- Pause -->
      <section id="screen-pause" class="screen hidden">
        <div class="panel">
          <h2>Paused</h2>
          <div class="stack">
            <button class="btn primary" id="pause-resume">Resume</button>
            <button class="btn" id="pause-restart">Restart Level</button>
            <button class="btn" id="pause-settings">Settings</button>
            <button class="btn" id="pause-levels">Level Select</button>
            <button class="btn ghost" id="pause-menu">Main Menu</button>
          </div>
        </div>
      </section>

      <!-- Failure -->
      <section id="screen-fail" class="screen hidden">
        <div class="panel fail">
          <h2 class="big">BALL LOST</h2>
          <p class="sub">Don't drop!</p>
          <div class="stack">
            <button class="btn primary" id="fail-retry">Retry</button>
            <button class="btn" id="fail-replay">Watch Replay</button>
            <button class="btn" id="fail-levels">Level Select</button>
          </div>
        </div>
      </section>

      <!-- Complete -->
      <section id="screen-complete" class="screen hidden">
        <div class="panel win">
          <h2 class="big">LEVEL COMPLETE</h2>
          <p class="sub" id="complete-stats"></p>
          <div class="stack">
            <button class="btn primary" id="complete-next">Next Level</button>
            <button class="btn" id="complete-watch">Watch Replay</button>
            <button class="btn" id="complete-replay">Play Again</button>
            <button class="btn ghost" id="complete-levels">Level Select</button>
          </div>
        </div>
      </section>

      <div id="toast" class="toast hidden"></div>
      <noscript>Don't Drop needs JavaScript and WebGL.</noscript>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
